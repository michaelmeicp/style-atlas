name: Catalog and Gallery Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 catalog/check.py
          node --check app.mjs
          node --check preview.mjs
          node --test gallery.test.mjs tests/check-previews.mjs
